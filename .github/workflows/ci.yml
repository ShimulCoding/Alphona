name: Build & Test

# Follows the README install steps on a fresh Windows machine and on Linux,
# so every push proves the project still installs, builds and passes its tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (README Part A, B & C)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Part A: RUN_STUDIO_WEB.bat installs dependencies and serves http://localhost:3000"
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'web.log'
          $proc = Start-Process cmd.exe -ArgumentList '/c', "RUN_STUDIO_WEB.bat < NUL > `"$log`" 2>&1" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:3000' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match 'Alpona') { $ok = $true; break }
            } catch { }
          }
          Get-Content $log
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'The web studio did not start on http://localhost:3000' }
          Write-Host 'Web studio served http://localhost:3000 successfully.'

      - name: "Part C: type check, 62 TypeScript tests and production build"
        shell: cmd
        run: |
          call npm run lint || exit /b 1
          call npm test || exit /b 1
          call npm run build || exit /b 1

      - name: "Part C: 48 C++11 tests and AlponaCLI (mingw32-make)"
        shell: cmd
        working-directory: cpp-alpona-studio
        run: |
          g++ --version
          mingw32-make test || exit /b 1
          mingw32-make cli || exit /b 1
          AlponaCLI.exe --kolam 7x7 --export-png kolam.png --export-svg kolam.svg || exit /b 1
          AlponaCLI.exe --motif padma --export-png padma.png --export-stl padma.stl --mode pitha || exit /b 1
          AlponaCLI.exe --motif padma --size 720 --team-plan 6 --floor-cm 300 --export-team-plan teams.csv || exit /b 1
          type teams.csv

      - name: "Part B1: build exactly like Code::Blocks F9 (AlponaStudio.cbp flags, bundled FreeGLUT)"
        shell: pwsh
        working-directory: cpp-alpona-studio
        run: |
          $cbp = [xml](Get-Content AlponaStudio.cbp)
          $units = $cbp.CodeBlocks_project_file.Project.Unit | ForEach-Object { $_.filename } | Where-Object { $_ -like 'src/*.cpp' }
          New-Item -ItemType Directory -Force -Path bin\Release | Out-Null
          g++ -O2 -std=c++11 -Iinclude -Ithird_party/freeglut/include @units -o bin/Release/AlponaStudio.exe `
              -static -Lthird_party/freeglut/lib/x64 -lfreeglut -lopengl32 -lglu32 -lwinmm -lgdi32
          if ($LASTEXITCODE -ne 0) { throw 'Code::Blocks-equivalent build failed' }
          cmd /c copy /Y "third_party\freeglut\bin\x64\libfreeglut.dll" "bin\Release"
          $deps = objdump -p bin/Release/AlponaStudio.exe | Select-String 'DLL Name'
          $deps
          if ($deps -match 'libstdc|libgcc|libwinpthread') { throw 'AlponaStudio.exe needs MinGW runtime DLLs' }

      - name: "Part B: RUN_CPP_DESKTOP.bat starts bin\\Release\\AlponaStudio.exe"
        shell: pwsh
        run: |
          cmd /c "RUN_CPP_DESKTOP.bat < NUL"
          Start-Sleep -Seconds 6
          $app = Get-Process AlponaStudio -ErrorAction SilentlyContinue
          if (-not $app) { throw 'RUN_CPP_DESKTOP.bat did not start AlponaStudio.exe' }
          Write-Host "AlponaStudio.exe is running (PID $($app.Id)) from $($app.Path)."
          $app | Stop-Process -Force

      - name: "Part B2: mingw32-make builds the desktop app with the bundled FreeGLUT"
        shell: cmd
        working-directory: cpp-alpona-studio
        run: |
          mingw32-make || exit /b 1
          if not exist AlponaStudio.exe exit /b 1
          if not exist libfreeglut.dll exit /b 1
          mingw32-make clean

  linux:
    name: Linux (npm + make + FreeGLUT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev
      - name: C++11 tests, CLI and desktop build
        working-directory: cpp-alpona-studio
        run: |
          make test
          make cli
          ./AlponaCLI --kolam 7x7 --export-png kolam.png --export-svg kolam.svg
          make
