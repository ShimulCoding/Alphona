name: Build & Test

# Follows the README install steps on a fresh Windows machine and on Linux,
# so every push proves the project still installs, builds and passes its tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (README Part A, B & C)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Part A: RUN_STUDIO_WEB.bat installs dependencies and serves http://localhost:3000"
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'web.log'
          $proc = Start-Process cmd.exe -ArgumentList '/c', "RUN_STUDIO_WEB.bat < NUL > `"$log`" 2>&1" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri 'http://localhost:3000' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match 'Alpona') { $ok = $true; break }
            } catch { }
          }
          Get-Content $log
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'The web studio did not start on http://localhost:3000' }
          Write-Host 'Web studio served http://localhost:3000 successfully.'

      - name: "Part C: type check, 54 TypeScript tests and production build"
        shell: cmd
        run: |
          call npm run lint || exit /b 1
          call npm test || exit /b 1
          call npm run build || exit /b 1

      - name: "Part C: 44 C++11 tests and AlponaCLI (mingw32-make)"
        shell: cmd
        working-directory: cpp-alpona-studio
        run: |
          g++ --version
          mingw32-make test || exit /b 1
          mingw32-make cli || exit /b 1
          AlponaCLI.exe --kolam 7x7 --export-png kolam.png --export-svg kolam.svg || exit /b 1
          AlponaCLI.exe --motif padma --export-png padma.png --export-stl padma.stl --mode pitha || exit /b 1

      - name: "Part B1: install FreeGLUT for MinGW exactly as the README describes"
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'freeglut.zip'
          Invoke-WebRequest -Uri 'https://www.transmissionzero.co.uk/files/software/development/GLUT/freeglut-MinGW.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $fg = Join-Path $env:RUNNER_TEMP 'freeglut'
          $mingw = Split-Path (Split-Path (Get-Command g++).Source)
          Write-Host "MinGW folder: $mingw"
          New-Item -ItemType Directory -Force -Path "$mingw\include\GL" | Out-Null
          Copy-Item "$fg\include\GL\*" "$mingw\include\GL\" -Force
          Copy-Item "$fg\lib\x64\libfreeglut.a" "$mingw\lib\" -Force
          Copy-Item "$fg\bin\x64\freeglut.dll" "cpp-alpona-studio\" -Force

      - name: "Part B: build the OpenGL desktop app and start it with RUN_CPP_DESKTOP.bat"
        shell: pwsh
        run: |
          Push-Location cpp-alpona-studio
          mingw32-make
          if (-not (Test-Path 'AlponaStudio.exe')) { throw 'AlponaStudio.exe was not built' }
          Pop-Location
          cmd /c "RUN_CPP_DESKTOP.bat < NUL"
          Start-Sleep -Seconds 5
          $app = Get-Process AlponaStudio -ErrorAction SilentlyContinue
          if (-not $app) { throw 'RUN_CPP_DESKTOP.bat did not start AlponaStudio.exe' }
          Write-Host "AlponaStudio.exe is running (PID $($app.Id))."
          $app | Stop-Process -Force

  linux:
    name: Linux (npm + make + FreeGLUT)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y freeglut3-dev
      - name: C++11 tests, CLI and desktop build
        working-directory: cpp-alpona-studio
        run: |
          make test
          make cli
          ./AlponaCLI --kolam 7x7 --export-png kolam.png --export-svg kolam.svg
          make
